name: Production Release

permissions:
  contents: write  # Required for creating and pushing tags

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string

jobs:
  create-tag-and-release:
    runs-on: ubuntu-22.04
    name: Create Git Tag and Docker Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ github.event.inputs.version }} -m "Production release ${{ github.event.inputs.version }}"

          # Add release notes to tag message if provided
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            git tag -d ${{ github.event.inputs.version }}
            git tag -a ${{ github.event.inputs.version }} -m "Production release ${{ github.event.inputs.version }}" -m "${{ github.event.inputs.release_notes }}"
          fi

          git push origin ${{ github.event.inputs.version }}

      - name: Build and push production Docker image
        id: docker-production
        uses: ./.github/actions/docker-push
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          image-name: agrotech-ai-app
          context-path: '.'
          dockerfile-path: 'env-deployment/Dockerfile'
          push-as-latest: 'true'
          tag-version: ${{ github.event.inputs.version }}

      - name: Post-release notification
        run: |
          echo "🎉 PRODUCTION RELEASE COMPLETED"
          echo "================================="
          echo "Version: ${{ github.event.inputs.version }}"
          echo "Docker Image: ${{ secrets.DOCKERHUB_USERNAME }}/agrotech-ai-app:${{ github.event.inputs.version }}"
          echo "Git Tag: ${{ github.event.inputs.version }}"
          echo "Latest Tag: Updated"
          echo "Release Notes: ${{ github.event.inputs.release_notes }}"
          echo "================================="

          # Create summary for the GitHub Actions summary page
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎉 Production Release Summary

          **Version:** \`${{ github.event.inputs.version }}\`
          **Docker Images:**
          - \`${{ secrets.DOCKERHUB_USERNAME }}/agrotech-ai-app:${{ github.event.inputs.version }}\`
          - \`${{ secrets.DOCKERHUB_USERNAME }}/agrotech-ai-app:latest\`

          **Git Tag:** \`${{ github.event.inputs.version }}\` ✅

          $(if [ -n "${{ github.event.inputs.release_notes }}" ]; then echo "**Release Notes:** ${{ github.event.inputs.release_notes }}"; fi)

          ### Release Details
          - 🏷️ Git tag created and pushed successfully
          - 📦 Docker images built and pushed to registry
          - 🚀 Both versioned and latest tags available

          EOF
