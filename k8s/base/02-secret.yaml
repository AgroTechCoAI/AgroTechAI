# Secret - Sensitive configuration data (base64 encoded)
# Secrets store sensitive information like passwords, tokens, and keys
# Note: For production, use external secret management like Sealed Secrets or HashiCorp Vault
apiVersion: v1
kind: Secret
metadata:
  name: agrotech-ai-secret
  namespace: agrotech-ai
  labels:
    app: agrotech-ai
    component: security
type: Opaque
data:
  # Example API key (base64 encoded "demo-api-key-12345")
  # In production, replace with actual secrets
  api-key: ZGVtby1hcGkta2V5LTEyMzQ1

  # Database password example (base64 encoded "changeme")
  # db-password: Y2hhbmdlbWU=
---
